name: Feature or API request
description: Suggest a command, a helper, or a free API to add to the directory
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations: { required: true }
  - type: input
    id: api
    attributes:
      label: API name and URL (if you're suggesting one)
      description: Please check that it is free to use and stable.
