name: Release

# Push a tag like v1.0.0 and this attaches a source zip and the SDK file to a new GitHub Release.
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the zip
        run: bash scripts/make-zip.sh "${GITHUB_REF_NAME}"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release/botbench-${GITHUB_REF_NAME}.zip" \
            botbench-sdk/dist/botbench.min.js \
            botbench-sdk/dist/botbench.js \
            botbench-sdk/dist/botbench.mjs \
            --title "${GITHUB_REF_NAME}" --generate-notes
